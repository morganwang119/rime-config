patch:
  style:
    color_scheme: minimal_gray
    color_scheme_dark: minimal_gray
    candidate_list_layout: linear
    text_orientation: horizontal
    horizontal: true
    inline_preedit: true
    corner_radius: 6
    hilited_corner_radius: 4
    border_height: 1
    border_width: 2
    spacing: 4
    candidate_format: "[label] [candidate] [comment]"
    font_face: "PingFang SC"
    font_point: 14
    label_font_point: 11
    comment_font_point: 12

  preset_color_schemes/minimal_gray:
    name: "极简灰"
    author: "Codex"
    back_color: 0xFAFAFA
    border_color: 0xFAFAFA
    candidate_text_color: 0x333333
    comment_text_color: 0x888888
    label_color: 0x999999
    text_color: 0x333333
    hilited_candidate_back_color: 0xE5E5E5
    hilited_candidate_text_color: 0x222222
    hilited_candidate_label_color: 0x666666
    hilited_comment_text_color: 0x666666
    hilited_text_color: 0x222222
    hilited_back_color: 0xE5E5E5

  preset_color_schemes/clean_porcelain:
    name: "晴瓷 · 简约白"
    author: "Codex"
    back_color: 0xFAFCFD
    border_color: 0xE6E8EB
    candidate_text_color: 0x38332F
    comment_text_color: 0x958B82
    label_color: 0xA3978D
    text_color: 0x38332F
    hilited_candidate_back_color: 0xD47836
    hilited_candidate_text_color: 0xFFFFFF
    hilited_candidate_label_color: 0xF5E9DD
    hilited_comment_text_color: 0xF5E9DD
    hilited_text_color: 0x38332F
    hilited_back_color: 0xF2ECE6

  preset_color_schemes/codex_dark:
    name: "Codex Dark"
    author: "Codex"
    back_color: 0x2b211c
    border_color: 0x3b3029
    candidate_text_color: 0xf4eee8
    comment_text_color: 0xb8aaa0
    hilited_candidate_back_color: 0xd68b39
    hilited_candidate_text_color: 0xffffff
    hilited_comment_text_color: 0xffffff
    hilited_text_color: 0xffffff
    label_color: 0xb8aaa0
    text_color: 0xf4eee8

  app_options:
    com.apple.Terminal:
      ascii_mode: true
    com.googlecode.iterm2:
      ascii_mode: true
    com.microsoft.VSCode:
      ascii_mode: true
    com.todesktop.230313mzl4w4u92:
      ascii_mode: true
    com.apple.dt.Xcode:
      ascii_mode: true
